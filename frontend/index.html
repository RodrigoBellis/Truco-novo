<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover é o que faz env(safe-area-inset-*) reportar valores
         reais no iPhone. Sem ele os insets vêm sempre 0, e o padding que o
         bottom nav já reservava para a faixa inferior nunca era aplicado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Truco do Novo — 5ª Edição do campeonato de 2026" />
    <title>Truco do Novo · 5ª Edição</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("truco-do-novo:theme");
          if (localStorage.getItem("truco-do-novo:appearance-version") !== "black-background-v1") {
            theme = "dark";
            localStorage.setItem("truco-do-novo:theme", theme);
            localStorage.setItem("truco-do-novo:appearance-version", "black-background-v1");
          }
          document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
